name: Build and Publish Docker Image

on:
  release:
    types: [published] # Se déclenche uniquement quand une release est publiée

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Autorise GitHub à écrire dans le registre d'images GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Force la création du tag de la release (ex: 1.7.6) ET du tag latest
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Identifiants de l'application Trakt de MyCinema, injectés depuis les
          # secrets du dépôt : ils ne figurent jamais dans les sources.
          # S'ils sont absents, l'image se construit quand même — la page de
          # réglages invite alors l'utilisateur à fournir sa propre application.
          build-args: |
            TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
            TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
